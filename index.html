<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمة 5 و 6 أولاد - مارمينا شبرا</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
/* ألوان اللوجو */
:root{--p:#1796ab;--p2:#0b6275;--a:#f39200;--g:#2e9e5b;--r:#e8352b;--pk:#f4577a;--bg:#eaf8fa;--card:#fff;--t:#12343b}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg) radial-gradient(circle at 15% 0,#fff6e5 0,transparent 35%);color:var(--t)}
header{background:linear-gradient(100deg,var(--p2),var(--p));border-bottom:6px solid var(--a);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:74px;width:74px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 3px 10px #0004;border:3px solid var(--a)}.logoTxt{font-size:34px}
header h1{margin:0;font-size:18px}header small{opacity:.9;display:block}
nav{display:flex;gap:6px;padding:8px;background:#fff;overflow-x:auto;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
nav button{border:2px solid transparent;background:#e1f4f7;color:var(--p2);font-weight:bold;padding:10px 16px;border-radius:20px;font-size:15px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--a);color:#fff;box-shadow:0 3px 8px #f3920066}.bd{background:var(--r);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-right:4px}
main{padding:14px;max-width:1000px;margin:auto}.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0b62751a;border-top:4px solid var(--a)}
input,select,textarea{padding:9px;border:2px solid #bfe3e9;border-radius:8px;font-size:15px;font-family:inherit;max-width:100%}
button.b{background:var(--p);color:#fff;border:0;border-radius:20px;padding:9px 14px;cursor:pointer;font-size:14px;font-family:inherit}
button.b.g{background:var(--g)}button.b.r{background:var(--r)}button.b.a{background:var(--a);color:#222}button.b.s{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}table{width:100%;border-collapse:collapse}
th{background:var(--p2);color:#fff;padding:9px}tr:nth-child(even) td{background:#f3fbfc}td{padding:7px;border-bottom:1px solid #d6eef2;text-align:center}
.ph,.big{cursor:zoom-in}.ph{width:44px;height:52px;object-fit:cover;border-radius:6px;background:#dbe9f7}.weak{color:var(--r);font-weight:bold}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal.on{display:flex}.mbox{background:#fff;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.big{width:170px;height:200px;object-fit:cover;border-radius:12px;background:#dbe9f7;display:block;margin:auto}
.kid{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #d6eef2}.kid label{flex:1;font-size:16px}
.kid input[type=checkbox]{width:24px;height:24px}video{width:100%;border-radius:12px;background:#000}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:30;font-size:17px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--p2),var(--p) 60%,var(--a));display:flex;align-items:center;justify-content:center;z-index:50}
#login .mbox{text-align:center;max-width:340px}#login input{width:100%;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:12px;color:var(--p2);font-weight:bold;padding:4px 0}
.cal button{border:2px solid transparent;background:#f3fbfc;border-radius:10px;padding:8px 0;font-size:14px;font-family:inherit;cursor:pointer;color:var(--t);font-weight:normal}
.cal button.rec{font-weight:900;background:#d9f2e3;color:#14602f;border-color:#8fd3a8}.cal button.td{border-color:var(--a)}.cal button.sel{background:var(--p);color:#fff;border-color:var(--p2)}.cal .e{visibility:hidden}
.fm{color:#b3124f;font-weight:bold;font-size:14px}.fc{flex:0 0 110px;text-align:center;border-right:2px solid #d6eef2;border-left:2px solid #d6eef2;padding:4px 6px}
.pill{display:inline-block;background:#fff1d6;color:#8a5200;border-radius:10px;padding:2px 8px;font-size:12px}
</style></head><body>

 Object.entries(db.kn).forEach(([d,m])=>{const up={};Object.entries(m).forEach(([id,t])=>{const key=d+'|'+id;if(shadow.kn[key]!==t){shadow.kn[key]=t;up[id]=t}});

function onData(local){need.size||(ready?(local||(pending=true)):(ready=true,render()))}
function startData(){if(unsubs.length)return;need=new Set(['kids','meta','att','notes','kn','vis']);ready=false;
 $('main').innerHTML='<div class="card">جاري تحميل البيانات...</div>';
 const L=(name,fn)=>unsubs.push(fx.onSnapshot(fx.collection(fx.db,name),s=>{fn(s);need.delete(name);onData(s.metadata.hasPendingWrites)},ferr));
 L('kids',s=>{db.kids=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ord||0)-(b.ord||0));shadow.kids={};db.kids.forEach(k=>shadow.kids[k.id]=JSON.stringify(kidData(k)))});
 L('meta',s=>{s.docs.forEach(d=>{const x=d.data();if(d.id=='fam'){db.fam=x.list||[];shadow.fam=JSON.stringify(db.fam)}if(d.id=='settings'){db.dis=x.dis||[];db.pin=x.pin||'';shadow.dis=JSON.stringify([db.dis,db.pin])}})});
 L('att',s=>{db.att={};shadow.att={};s.docs.forEach(d=>{const m={};Object.entries(d.data()).forEach(([id,v])=>{m[id]=v;shadow.att[d.id+'|'+id]=v});db.att[d.id]=m})});
 L('notes',s=>{db.notes={};shadow.notes={};s.docs.forEach(d=>{db.notes[d.id]=noteData(d.data());shadow.notes[d.id]=JSON.stringify(db.notes[d.id])})});
 L('kn',s=>{db.kn={};shadow.kn={};s.docs.forEach(d=>{const m={};Object.entries(d.data()).forEach(([id,t])=>{m[id]=t;shadow.kn[d.id+'|'+id]=t});db.kn[d.id]=m})});
 L('vis',s=>{db.vis=s.docs.map(d=>({id:d.id,...d.data()}));shadow.vis={};db.vis.forEach(v=>shadow.vis[v.id]=JSON.stringify(visData(v)))})}

function img(file,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.onerror=()=>cb('');i.src=r.result};r.readAsDataURL(file)}

function decodeQR(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);const d=x.getImageData(0,0,c.width,c.height),res=jsQR(d.data,c.width,c.height);cb(res?res.data:null)};i.src=r.result};r.readAsDataURL(file)}

function saveKN(id){const v=$('kn').value.trim();(db.kn[adate]=db.kn[adate]||{});if(v)db.kn[adate][id]=v;else delete db.kn[adate][id];save();$('m3').classList.remove('on');renderList()}
function mark(id,v){(db.att[adate]=db.att[adate]||{})[id]=v?1:0;save();renderList();$('nav').children[4]&&render()}
function xls(html,name){const b=new Blob(['\ufeff<html dir="rtl"><meta charset="utf-8"><body>'+html+'</body></html>'],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.xls';a.click()}
function attRep(){const f=$('rf').value,t=$('rt').value,fm=$('rfam').value,d=dates().filter(x=>(!f||x>=f)&&(!t||x<=t));if(!d.length)return say('لا توجد أيام حضور في الفترة');

// ---- سكان QR
let stream=null,scanning=false,last={t:'',at:0};
async function startScan(){$('m2').classList.add('on');$('sd').textContent='التاريخ: '+adate;$('ss').textContent='جاري فتح الكاميرا...';
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vid.srcObject=stream;await vid.play();scanning=true;$('ss').textContent='وجّه الكاميرا على الـ QR';tick()}catch(e){$('ss').textContent='تعذر فتح الكاميرا (لازم الموقع يكون HTTPS وتسمح بالكاميرا)'}}
function tick(){if(!scanning)return;if(vid.readyState==4){const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;const x=c.getContext('2d');x.drawImage(vid,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
if(r&&!(r.data==last.t&&Date.now()-last.at<3000)){last={t:r.data,at:Date.now()};const k=db.kids.find(k=>k.qr==r.data);
if(k){const was=(db.att[adate]||{})[k.id];mark(k.id,true);$('ss').innerHTML=`<b style="color:var(--g)">✅ ${esc(k.name)}</b>${was?' (كان مسجل قبل كده)':''}`;beep(880)}else{$('ss').innerHTML='<b class="weak">QR غير مربوط بأي ولد</b>';beep(220)}}}
requestAnimationFrame(tick)}
function stopScan(){scanning=false;stream&&stream.getTracks().forEach(t=>t.stop());$('m2').classList.remove('on');render()}
function beep(f){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),150)}catch(e){}}

<div class="row"><textarea id="vn" rows="2" style="flex:1" placeholder="ملاحظات"></textarea><label><input type="checkbox" id="vc"> إظهار في الإشعارات</label><button class="b g" onclick="addVis()">تسجيل</button></div></div>
